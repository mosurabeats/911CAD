; Interim CAD configuration. Copy to config.ini and edit.
; Secure defaults: TLS required, MFA required, inactive accounts disabled after 90 days.

[server]
; 0.0.0.0 = all interfaces. Port 8443 (HTTPS).
host = 0.0.0.0
port = 8443
; REQUIRED: TLS certificate and private key, PEM format (see docs/INSTALL_WINDOWS.md, step 3).
tls_cert = data/tls.crt
tls_key = data/tls.key
; Only these networks may connect (dispatch PCs, PD desk PCs, MDT VPN pool). Comma-separated.
; Example: allowed_networks = 10.20.30.0/24, 10.20.31.0/24, 172.16.50.0/24
allowed_networks =
; Testing only. Never true in production.
allow_insecure_http = false
; true only behind a reverse proxy (e.g. IIS) that sets X-Forwarded-For.
trust_proxy = false

[agency]
name = Montpelier Police Department
ori =
; Number patterns. Placeholders: {yy}=26  {yyyy}=2026  {seq}=sequence  {case_prefix}  {call_prefix}
; {seq:04d} pads to 4 digits: 26MPD0001, 26MPD0002 ... (past 9999 it becomes 26MPD10000).
; Sequences restart at 1 each January 1.
call_number_format = {yy}MPD{seq:04d}
; Case/report numbers (issued with the "Get case #" button). Example: 26MPD-00001
case_number_format = {yy}{case_prefix}-{seq:05d}
case_prefix = MPD
call_prefix =
; To continue from Valcour's last number instead of 0001, run (before taking calls):
;   python manage.py set-next-number call 4512      -> next call will be 26MPD4512

[security]
; Inactivity timeout for the CAD session (CJIS: 30 minutes or less)
session_idle_minutes = 30
session_max_hours = 12
; Multi-factor sign-in (authenticator app). CJIS requires MFA for access to CJI. Keep true.
require_mfa = true
lockout_attempts = 5
lockout_minutes = 15
; Confirm the minimum with your CJIS Systems Officer for the current CJIS Security Policy version.
password_min_length = 12
; Accounts unused for this many days are disabled automatically (0 = never).
inactive_disable_days = 90

[archive]
; Folder that receives a copy of EVERY call (a .txt record + a .json file per call, plus a
; Daily\YYYY-MM-DD.csv call log). Files are rewritten whenever a call changes.
; When running as a service use the UNC path, not a drive letter:  dir = \\townserver\police\CAD\Calls
; Leave empty to disable. The live database stays local; never put db_path on a network drive.
dir =
interval_seconds = 30
; Also write a printable PDF of each call and a daily PDF call log (Daily\YYYY-MM-DD.pdf).
pdf = true

[active911]
; Page Fire/EMS crews through Active911 when units are dispatched. The CAD e-mails each alert,
; in Active911's "Cadpage" format, to your agency's Active911 alert address (Active911 > Agency tab,
; looks like 1234-abc1234@alert.active911.com). Tell Active911 support you are sending "Cadpage" format.
enabled = false
fire_address =
ems_address =
; Police alerts are OFF unless you set this; police call details are CJI - ask your CSO first.
police_address =
; Outgoing mail server the CAD sends through (from IT). Office 365 example: smtp.office365.com, 587, starttls
smtp_host =
smtp_port = 587
; starttls | ssl | none
smtp_security = starttls
smtp_username =
; Prefer a password file readable only by Administrators and the CAD service account:
smtp_password_file =
smtp_password =
from_address =
; Caller name/phone are NOT sent to phones unless this is true.
include_caller = false
; Used when a call has no city entered
default_city =

[audit]
; Second, append-only copy of the audit log on ANOTHER machine/share that CAD users and
; the CAD server's admins cannot modify (e.g. a share only IT security/TAC can write-protect).
; Example: mirror_dir = \\townserver\cjis-audit\InterimCAD
mirror_dir =

[storage]
db_path = data/cad.sqlite3
backup_dir = data/backups
log_file = data/logs/server.log
