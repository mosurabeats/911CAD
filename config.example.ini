; Interim CAD configuration. Copy to config.ini and edit.

[server]
; 0.0.0.0 listens on all network interfaces. Use the server's LAN address to restrict.
host = 0.0.0.0
port = 8443
; Strongly recommended: TLS certificate and key (PEM). See `python manage.py make-cert`.
tls_cert =
tls_key =
; Set true only if running behind a reverse proxy that sets X-Forwarded-For.
trust_proxy = false

[agency]
name = Montpelier Police Department
; Your agency ORI (used on exports)
ori =
; Call numbers look like <call_prefix>26-000123 ; case numbers like 26<case_prefix>-00042
call_prefix =
case_prefix = MPD

[security]
; Inactivity timeout (CJIS session lock: 30 minutes or less)
session_idle_minutes = 30
session_max_hours = 12
; Require every user to enroll an authenticator app (TOTP). Recommended: true.
require_mfa = true
lockout_attempts = 5
lockout_minutes = 15
password_min_length = 12

[archive]
; Folder that receives a copy of EVERY call (a .txt record + a .json file per call, plus a
; Daily\YYYY-MM-DD.csv call log). Files are rewritten whenever a call changes.
; Example for a mapped network drive:  dir = I:\CAD\Calls
; Better (works when running as a service, which may not see mapped drive letters):
;   dir = \\townserver\police\CAD\Calls
; Leave empty to disable. The live database stays local; never put db_path on a network drive.
dir =
interval_seconds = 30

[storage]
db_path = data/cad.sqlite3
backup_dir = data/backups
